<div class="carousel-container" tabindex="0" role="group" aria-label="{{ page.title }} images">
  <button class="carousel-btn prev" type="button" aria-label="Previous image">&#10094;</button>
  <div class="carousel-track-wrapper">
    <div class="carousel-track">
      {% for item in page.slider %}
      <div class="carousel-slide {% if forloop.first %}active{% endif %}">
        <a href="{{ item.url }}">
          <img src="{{ item.url }}" alt="{{ page.title }}, image {{ forloop.index }} of {{ forloop.length }}"{% unless forloop.first %} loading="lazy"{% endunless %}>
        </a>
      </div>
      {% endfor %}
    </div>
  </div>
  <button class="carousel-btn next" type="button" aria-label="Next image">&#10095;</button>
</div>
<script src="/assets/js/carousel.js" defer></script>
